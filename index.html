<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Impeccable Cookie Company</title>
    <link rel="canonical" href="https://impeccablecookie.com/" />
    <!-- Font CSS loads without blocking first render (it used to be an @import chained
         behind the app CSS). display=swap shows the fallback stack until Inter arrives. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" />
    </noscript>
    <!-- The hero photo is the LCP element but is rendered by JS; start fetching it now.
         Must match the srcset/sizes in src/components/Photo.tsx and Hero.tsx. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      imagesrcset="/images/hero-480.avif 480w, /images/hero-960.avif 960w, /images/hero-1440.avif 1440w"
      imagesizes="(min-width: 1536px) 720px, (min-width: 768px) 45vw, calc(100vw - 48px)"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Decode the URL encoded by 404.html for SPA routing on GitHub Pages.
      // 404.html encodes /page?id=foo as /?p=page&q=id%3Dfoo so that GitHub
      // serves index.html. This script restores the original URL before React mounts.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var p = params.get('p');
        if (p !== null) {
          var q = params.get('q');
          var restored = '/' + decodeURIComponent(p) +
            (q ? '?' + decodeURIComponent(q) : '') +
            window.location.hash;
          window.history.replaceState(null, null, restored);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
